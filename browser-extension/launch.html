<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Opening Obsidian…</title>
	<style>
		:root { color-scheme: light dark; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: Canvas; color: CanvasText; }
		main { text-align: center; padding: 16px; }
		button { margin: 4px; padding: 7px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
	</style>
</head>
<body>
	<main>
		<p><strong>Opening the job in Obsidian…</strong></p>
		<p>If Chrome asks, click <em>Open Obsidian</em> (tick <em>Always allow</em> to skip this next time).<br>This tab closes when you come back to Chrome.</p>
		<p><button id="retry">Open again</button><button id="close">Close tab</button></p>
	</main>
	<script src="launch.js"></script>
</body>
</html>
