<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>SWE Job Tracker</title>
	<style>
		:root { --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --accent: #7c3aed; --accent-fg: #ffffff; --bad: #cf222e; color-scheme: light dark; }
		@media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #e6e6e6; --muted: #9a9a9a; --border: #3a3a3a; --accent: #8b5cf6; --bad: #f85149; } }
		body { margin: 0; width: 260px; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		main { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
		.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
		.who { color: var(--muted); font-size: 12px; margin-bottom: 2px; }
		button { padding: 8px 10px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
		.primary { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); }
		.secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
		.link { background: none; border: 0; color: var(--muted); font-weight: 400; padding: 2px 0; text-decoration: underline; }
		.error { color: var(--bad); font-size: 12px; }
		.hint { color: var(--muted); font-size: 11.5px; }
	</style>
</head>
<body>
	<main>
		<span class="label">SWE Job Tracker</span>
		<div class="who" id="who"></div>
		<button class="primary" id="autofill">Autofill this application</button>
		<button class="secondary" id="parse">Send this job to Obsidian</button>
		<button class="link" id="profile">Edit autofill profile</button>
		<div class="error" id="error" hidden></div>
		<div class="hint" id="shortcut"></div>
	</main>
	<script src="popup.js"></script>
</body>
</html>
